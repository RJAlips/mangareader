name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App
        run: |
          xcodebuild -project MangaReader.xcodeproj \
                     -scheme MangaReader \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/MangaReader.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/MangaReader.xcarchive/Products/Applications/MangaReader.app Payload/
          zip -r MangaReader.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-unsigned-ipa
          path: MangaReader.ipa
